# PR 校验门禁：翻译批次 PR 必须通过 validate_po.sh 才可合并
name: validate

on:
  pull_request:
    paths:
      - 'locale/**'
      - 'scripts/**'
      - 'requirements-zh.txt'
      - 'glossary.md'
      - 'STYLE_GUIDE.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 变更文件检测需要 base 分支历史

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install -r requirements-zh.txt
          sudo apt-get update && sudo apt-get install -y gettext

      - name: Generate workdir
        run: bash scripts/gen_workdir.sh

      - name: Validate po (batch gate on changed files + global fuzzy/markup/term + build smoke)
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'locale/' | grep '\.po$' || true)
          echo "变更 po 文件: ${CHANGED:-（无）}"
          # 批次模式: 变更 po 必须完成翻译；全局 fuzzy=0 / markup / term + 构建冒烟
          # （sphinx-intl stat 全量硬门禁留给 v1.0 收官，见 validate_po.sh 头注）
          bash scripts/validate_po.sh $CHANGED

      - name: Linkcheck (GitHub 网络权威判定；本机网络受限无法判定)
        run: make -C workdir/docs linkcheck
